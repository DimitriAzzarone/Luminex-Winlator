name: Build Luminex Windows minimo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura compilatore
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compila
        shell: cmd
        run: cl /nologo /O1 /Os /MT /DUNICODE /D_UNICODE src\\main.cpp /Fe:Luminex.exe /link /SUBSYSTEM:WINDOWS shell32.lib user32.lib

      - name: Crea ZIP
        shell: pwsh
        run: Compress-Archive -Path Luminex.exe -DestinationPath Luminex-Windows-Minimo.zip

      - name: Carica programma
        uses: actions/upload-artifact@v4
        with:
          name: Luminex-Windows-Minimo
          path: Luminex-Windows-Minimo.zip
          if-no-files-found: error
