name: Build Luminex Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build
        run: |
          npm install
          npm run dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Luminex-Windows-0.2
          path: dist/Luminex-Windows-0.2-portable.exe
          if-no-files-found: error
